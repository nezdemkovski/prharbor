name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SCHEME: PRHarbor
  APP_NAME: PRHarbor

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(awk '/MARKETING_VERSION =/ { gsub(/;/, "", $3); print $3; exit }' PRHarbor.xcodeproj/project.pbxproj)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set version in project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a numeric release version" >&2; exit 1; }
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION;/" PRHarbor.xcodeproj/project.pbxproj

      - name: Resolve packages
        run: xcodebuild -project PRHarbor.xcodeproj -scheme $SCHEME -resolvePackageDependencies

      - name: Run tests
        run: |
          xcodebuild test \
            -project PRHarbor.xcodeproj \
            -scheme $SCHEME \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild \
            -project PRHarbor.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and package DMG
        run: |
          APP_PATH="build/Build/Products/Release/$APP_NAME.app"
          bash Scripts/package-release.sh "$APP_PATH" "$GITHUB_WORKSPACE"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: PR Harbor v${{ steps.version.outputs.version }}
          files: |
            ${{ env.APP_NAME }}.dmg
            SHA256SUMS
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true

      - name: Get SHA256
        if: startsWith(github.ref, 'refs/tags/')
        id: sha
        run: echo "sha256=$(shasum -a 256 PRHarbor.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          REPO="nezdemkovski/homebrew-tap"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/${REPO}.git tap
          mkdir -p tap/Casks

          cat > tap/Casks/prharbor.rb << EOF
          cask "prharbor" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/nezdemkovski/prharbor/releases/download/v#{version}/PRHarbor.dmg"
            name "PR Harbor"
            desc "GitHub pull requests in your menu bar"
            homepage "https://github.com/nezdemkovski/prharbor"

            app "PRHarbor.app"
            depends_on macos: :golden_gate
            depends_on arch: :arm64
            depends_on formula: "gh"

            zap trash: [
              "~/Library/Preferences/com.nezdemkovski.prharbor.plist",
            ]
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/prharbor.rb
          git commit -m "Update PR Harbor to $VERSION" || exit 0
          git push

      - name: Upload artifact (for manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}.dmg
          path: ${{ env.APP_NAME }}.dmg
