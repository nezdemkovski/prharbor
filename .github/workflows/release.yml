name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SCHEME: PRHarbor
  APP_NAME: PRHarbor

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(awk '/MARKETING_VERSION =/ { gsub(/;/, "", $3); print $3; exit }' PRHarbor.xcodeproj/project.pbxproj)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set version in project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a numeric release version" >&2; exit 1; }
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION;/" PRHarbor.xcodeproj/project.pbxproj

      - name: Resolve packages
        run: xcodebuild -project PRHarbor.xcodeproj -scheme $SCHEME -resolvePackageDependencies

      - name: Run tests
        run: |
          xcodebuild test \
            -project PRHarbor.xcodeproj \
            -scheme $SCHEME \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate GraphQL documents
        run: |
          bash Scripts/validate-graphql.sh
          git diff --exit-code Scripts/graphql/selected-fields.txt

      - name: Build Release
        run: |
          xcodebuild \
            -project PRHarbor.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate and notary key
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          for value in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_API_KEY; do
            [[ -n "${!value}" ]] || { echo "Missing secret for $value" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Sign, notarize and package DMG
        env:
          SIGNING_IDENTITY: "Developer ID Application: Yuriy Nezdemkovski (DBVKAAM5R6)"
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          APP_PATH="build/Build/Products/Release/$APP_NAME.app"
          bash Scripts/package-release.sh "$APP_PATH" "$GITHUB_WORKSPACE"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: PR Harbor v${{ steps.version.outputs.version }}
          files: |
            ${{ env.APP_NAME }}.dmg
            SHA256SUMS
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true

      - name: Get SHA256
        if: startsWith(github.ref, 'refs/tags/')
        id: sha
        run: echo "sha256=$(shasum -a 256 PRHarbor.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          REPO="nezdemkovski/homebrew-tap"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/${REPO}.git tap
          mkdir -p tap/Casks

          cat > tap/Casks/prharbor.rb << EOF
          cask "prharbor" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/nezdemkovski/prharbor/releases/download/v#{version}/PRHarbor.dmg"
            name "PR Harbor"
            desc "GitHub pull requests in your menu bar"
            homepage "https://github.com/nezdemkovski/prharbor"

            app "PRHarbor.app"
            depends_on macos: ">= :tahoe"
            depends_on arch: :arm64

            zap trash: [
              "~/Library/Containers/com.nezdemkovski.prharbor",
              "~/Library/Preferences/com.nezdemkovski.prharbor.plist",
              "~/Library/Caches/PRHarbor",
            ]
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/prharbor.rb
          git commit -m "Update PR Harbor to $VERSION" || exit 0
          git push

      - name: Upload artifact (for manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}.dmg
          path: ${{ env.APP_NAME }}.dmg
