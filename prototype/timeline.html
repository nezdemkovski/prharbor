<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Timeline</title>
<style>
:root {
  --bg: #eceef2;
  --panel: #ffffff;
  --line: #eef0f3;
  --line-strong: #e3e6eb;
  --text: #16181c;
  --muted: #858c96;
  --faint: #b5bbc4;
  --track: #f8f9fa;
  --active: #e3e6eb;
  --hover: #f6f7f9;
  --accent: #3d82f6;
  --accent-soft: #e9f1fe;
  --fresh: #22b25b;
  --aging: #d4a106;
  --stale: #f07a1a;
  --rotting: #e5484d;
  --shadow: 0 1px 2px rgba(20,24,30,.04), 0 12px 40px rgba(20,24,30,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f11; --panel: #1a1b1f; --line: #26282d; --line-strong: #2f3237;
    --text: #eceef1; --muted: #8b919a; --faint: #5b6068; --track: #1f2125;
    --active: #33363c; --hover: #222428; --accent: #5b9cff; --accent-soft: #1d2a40;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f11; --panel: #1a1b1f; --line: #26282d; --line-strong: #2f3237;
  --text: #eceef1; --muted: #8b919a; --faint: #5b6068; --track: #1f2125;
  --active: #33363c; --hover: #222428; --accent: #5b9cff; --accent-soft: #1d2a40;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* faux menu bar, for context */
.menubar {
  height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 18px;
  padding: 0 16px; font-size: 13px; font-weight: 500;
  background: color-mix(in srgb, var(--panel) 70%, transparent);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.menubar .item { display: flex; align-items: center; gap: 5px; opacity: .8; }
.menubar .pullbar { opacity: 1; padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--text) 10%, transparent); }
.menubar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rotting); }

.stage { display: flex; justify-content: center; padding: 18px 16px 40px; }
.panel {
  width: 780px; max-width: 100%;
  background: var(--panel);
  border-radius: 22px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  overflow: hidden;
  position: relative;
}

/* command bar */
.cmd { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.cmd-icon {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}
.field { position: relative; flex: 1; height: 28px; }
.field input, .field .hl {
  position: absolute; inset: 0; width: 100%;
  font: 500 18px/28px -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  letter-spacing: -.01em; padding: 0; margin: 0; border: 0; white-space: pre;
}
.field input { background: transparent; color: transparent; caret-color: var(--accent); outline: none; }
.field input::placeholder { color: var(--faint); }
.field .hl { pointer-events: none; color: var(--text); overflow: hidden; }
.field .tok { color: var(--accent); background: var(--accent-soft); border-radius: 5px; box-shadow: 0 0 0 2px var(--accent-soft); }
.kbd {
  min-width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 8px;
}

/* header */
.head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
.head h1 { white-space: nowrap; font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.head .date { color: var(--faint); font-weight: 500; margin-left: 6px; }
.spacer { flex: 1; }
.seg { display: flex; background: var(--track); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 7px; color: var(--muted); font-weight: 550; font-size: 12px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line-strong); }
.seg .n { color: var(--faint); margin-left: 4px; font-weight: 500; }

.summary { display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; gap: 14px; padding: 2px 18px 12px; color: var(--muted); font-size: 12px; }
.rotbar { display: flex; width: 120px; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.rotbar span { display: block; height: 100%; border-radius: 2px; transition: flex-grow .3s; }
.summary > span { white-space: nowrap; }
.summary b { color: var(--text); font-weight: 600; }
.summary .warn { color: var(--rotting); font-weight: 550; }
.legend { display: flex; gap: 10px; margin-left: auto; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

/* timeline */
.tl { position: relative; padding: 0 18px; }
.axis { display: grid; grid-template-columns: 270px 1fr; height: 30px; position: relative; }
.axis .ticks { position: relative; }
.tick { position: absolute; bottom: 7px; transform: translateX(-50%); font-size: 11px; color: var(--faint); white-space: nowrap; }
.today-pill {
  position: absolute; bottom: 3px; transform: translateX(-50%);
  background: var(--text); color: var(--panel); font-size: 10.5px; font-weight: 650;
  padding: 2px 7px; border-radius: 10px; z-index: 3;
}
.cursor-pill {
  position: absolute; bottom: 3px; transform: translateX(-50%);
  background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 650;
  padding: 2px 8px; border-radius: 10px; z-index: 4; white-space: nowrap;
  opacity: 0; transition: opacity .12s;
}

.rows { position: relative; max-height: max(456px, calc(100vh - 470px)); overflow-y: auto; overflow-x: hidden; margin: 0 -18px; padding: 0 18px 4px; scrollbar-width: thin; }
.rows-in { position: relative; }
.grid { position: absolute; top: 0; bottom: 0; left: 270px; right: 0; pointer-events: none; }
.grid .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.grid .we { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--track) 70%, transparent); }
.grid .now { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--text); opacity: .75; z-index: 2; }
.grid .future { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(90deg, transparent 0 3px, color-mix(in srgb, var(--line) 60%, transparent) 3px 4px); opacity: .6; }
.grid .cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); opacity: 0; transition: opacity .12s; z-index: 3; }

.section {
  display: grid; grid-template-columns: 270px 1fr; height: 30px; align-items: end;
  font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 5px; position: relative;
}
.section .count { color: var(--faint); margin-left: 5px; }
.section.today { color: var(--accent); }

.row {
  display: grid; grid-template-columns: 270px 1fr; height: 50px; align-items: center;
  position: relative; border-radius: 12px; cursor: pointer;
  transition: opacity .25s, transform .3s, height .3s;
}
.row::before {
  content: ""; position: absolute; inset: 2px -8px; border-radius: 12px;
  background: transparent; transition: background .12s; z-index: 0;
}
.row:hover::before { background: color-mix(in srgb, var(--hover) 70%, transparent); }
.row.sel::before { background: var(--accent-soft); opacity: .55; }
.row > * { position: relative; z-index: 1; }
.row.snoozed { opacity: .5; }
.row.leaving { opacity: 0; transform: translateX(24px); height: 0; overflow: hidden; }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 14px; }
.av {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 12px; font-weight: 650; color: #fff;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}
.who .txt { min-width: 0; }
.who .title { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
.who .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
.meta .smell { font-weight: 600; }
.chip-s { font-size: 10px; font-weight: 650; padding: 0 5px; border-radius: 4px; background: var(--track); border: 1px solid var(--line-strong); color: var(--muted); line-height: 15px; }

.track { position: relative; height: 34px; background: var(--track); border-radius: 10px; border: 1px solid var(--line); overflow: visible; }
.seg-a, .seg-i, .seg-z {
  position: absolute; top: 5px; bottom: 5px;
  transition: left .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1);
}
.seg-a { background: var(--active); border-radius: 7px 0 0 7px; }
.seg-a.clip { border-radius: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
.seg-i {
  --c: var(--muted);
  border-radius: 0 7px 7px 0;
  background: repeating-linear-gradient(135deg,
    color-mix(in srgb, var(--c) 50%, transparent) 0 2px,
    color-mix(in srgb, var(--c) 14%, transparent) 2px 6px);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent);
}
.seg-i.solo { border-radius: 7px; }
.seg-i.clip { border-radius: 0 7px 7px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
.seg-z {
  border: 1.5px dashed color-mix(in srgb, var(--muted) 70%, transparent); border-left: 0;
  border-radius: 0 7px 7px 0;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; font-size: 11px;
}
.clip-label {
  position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  font-size: 10.5px; font-weight: 650; color: var(--muted); z-index: 2;
}
.stall-label {
  position: absolute; top: 50%; transform: translate(calc(-100% - 6px), -50%);
  font-size: 10.5px; font-weight: 700; z-index: 2; white-space: nowrap;
  transition: left .45s cubic-bezier(.2,.8,.2,1);
}

/* suggestions */
.suggest { display: flex; align-items: center; gap: 8px; padding: 12px 18px 4px; flex-wrap: wrap; }
.suggest .lbl { color: var(--muted); font-weight: 550; display: flex; gap: 6px; align-items: center; margin-right: 2px; }
.pill {
  padding: 6px 12px; border-radius: 20px; font-weight: 580; font-size: 12.5px;
  border: 1px solid var(--line-strong); background: var(--panel);
  box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: background .15s, border-color .15s, color .15s;
}
.pill:hover { background: var(--hover); }
.pill.on { background: color-mix(in srgb, var(--fresh) 16%, var(--panel)); border-color: color-mix(in srgb, var(--fresh) 50%, transparent); color: color-mix(in srgb, var(--fresh) 80%, var(--text)); }

/* shared chrome */
.card { margin: 12px 18px 18px; border: 1px solid var(--line-strong); border-radius: 14px; }
.ghost { height: 32px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-weight: 560; }
.ghost:hover { background: var(--hover); color: var(--text); }
.tooltip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--panel);
  font-size: 11.5px; font-weight: 550; padding: 5px 9px; border-radius: 7px; white-space: pre; text-align: left;
  opacity: 0; transform: translate(-50%, calc(-100% - 10px)); transition: opacity .1s;
}
.toast {
  position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 20px);
  background: var(--text); color: var(--panel); padding: 9px 16px; border-radius: 12px; font-weight: 560;
  opacity: 0; transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1); pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.hint { text-align: center; color: var(--faint); font-size: 11.5px; padding: 0 0 20px; }
.hint kbd { font: inherit; padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--panel); color: var(--muted); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.caret { width: 22px; height: 22px; border-radius: 6px; color: var(--muted); flex: none; display: grid; place-items: center; font-size: 11px; }
.caret:hover { background: var(--hover); color: var(--text); }
.stack-ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--track); border: 1px solid var(--line-strong); color: var(--muted); }

/* live data */
img.av { object-fit: cover; background: var(--track); }
.live { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--fresh); padding: 3px 9px; border-radius: 10px; background: color-mix(in srgb, var(--fresh) 12%, transparent); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.live.mock { color: var(--muted); background: var(--track); }

/* freshness zones */
.zones { display: flex; background: var(--track); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.zone { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; font-size: 12px; font-weight: 550; color: var(--muted); transition: background .15s, color .15s; }
.zone i { width: 7px; height: 7px; border-radius: 50%; }
.zone b { color: var(--text); font-weight: 650; }
.zone:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.zone.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line-strong); }
.zone:disabled { opacity: .45; cursor: default; }

/* timeline axis: today is the right edge */
.today-pill { transform: translateX(-100%); }
.tick.edge { transform: none; }
.snz-tag { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 10.5px; font-weight: 650; color: var(--muted); z-index: 2; }

/* repo groups */
.repo-head { display: grid; grid-template-columns: 270px 1fr; height: 34px; align-items: center; cursor: pointer; margin-top: 6px; border-radius: 8px; }
.repo-head:hover .rh-name { color: var(--text); }
.rh-name { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; color: var(--muted); white-space: nowrap; overflow: hidden; }
.rh-name .caret { width: 16px; height: 16px; margin: 0 2px 0 0; font-size: 12px; }
.rh-owner { color: var(--faint); font-weight: 500; }
.rh-name .count { color: var(--faint); font-weight: 500; margin-left: 4px; }
.rh-ic { display: inline-grid; place-items: center; margin-right: 4px; color: var(--muted); }
.rh-track { position: relative; height: 100%; }
.rh-track .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); opacity: .75; box-shadow: 0 0 0 1.5px var(--panel); }

/* stack: avatars melt into one liquid capsule that ends in the target branch */
.row.layer { height: 44px; }
.stack-group { position: relative; margin: 4px 0; }
.liquid { position: absolute; z-index: 1; left: -6px; top: 0; width: 42px; pointer-events: none; overflow: visible; }
.liquid g { fill: var(--active); }
.stack-group .row.layer .who { gap: 10px; }
.stack-group .row.layer .av { box-shadow: 0 0 0 2px var(--panel); }
.av-wrap { position: relative; z-index: 2; flex: none; display: flex; }
.lnum {
  position: absolute; right: -5px; bottom: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: var(--muted);
  background: var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
.stack-tail { display: grid; grid-template-columns: 270px 1fr; height: 32px; align-items: start; }
.stack-tail .who { position: relative; z-index: 2; gap: 10px; height: 26px; align-items: center; }
.cap-node {
  width: 22px; height: 22px; margin: 0 4px; flex: none; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line-strong); position: relative; z-index: 2;
}
.cap-node svg { width: 11px; height: 11px; }
.tail-text { display: flex; align-items: baseline; gap: 5px; min-width: 0; white-space: nowrap; }
.tail-branch { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tail-merged { font-size: 11px; font-weight: 500; color: var(--faint); }

/* event marks: commits are ticks, people are tiny avatars */
.tick-c { position: absolute; top: 50%; width: 1.5px; height: 12px; transform: translate(-50%, -50%); border-radius: 1px; z-index: 2;
  background: color-mix(in srgb, var(--text) 38%, transparent); }
.tick-c::after { content: ""; position: absolute; inset: -5px -3px; }
.tick-c:hover { background: var(--text); }
.mk { position: absolute; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; z-index: 3; transition: transform .12s; }
.mk:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 4; }
.mk-av { --ring: var(--faint); width: 16px; height: 16px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center;
  background: var(--track); box-shadow: 0 0 0 1.5px var(--ring), 0 0 0 3px var(--panel); }
.mk-av + .mk-av { margin-left: -5px; }
.mk-av img { width: 100%; height: 100%; object-fit: cover; }
.mk-av b { font-size: 8.5px; font-weight: 700; color: var(--muted); }
.mk-av.approved { --ring: var(--fresh); }
.mk-av.changes { --ring: var(--stale); }
.mk-av.comment { --ring: color-mix(in srgb, var(--muted) 70%, transparent); }
.mk-av.requested { --ring: var(--accent); opacity: .65; }
.mk-av.requested img { filter: grayscale(.6); }
.mk-av.ci_fail { --ring: var(--rotting); width: 8px; height: 8px; border-radius: 2px; background: var(--rotting); }
.mk-more { font-size: 9.5px; font-weight: 700; color: var(--muted); margin-left: 3px; text-shadow: 0 0 3px var(--panel); }

/* brushing */
.track { cursor: crosshair; }
body.brushing, body.brushing * { cursor: ew-resize !important; user-select: none; }
.grid .brush { position: absolute; top: 0; bottom: 0; display: none; z-index: 1;
  background: color-mix(in srgb, var(--accent) 9%, transparent);
  border-left: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-right: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.brush-pill { position: absolute; bottom: 3px; transform: translateX(-50%); display: none; z-index: 5; white-space: nowrap;
  background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 650; padding: 2px 8px; border-radius: 10px; }
.brush-pill button { margin-left: 5px; color: #fff; opacity: .8; font-size: 12px; line-height: 1; }
.brush-pill button:hover { opacity: 1; }
body.brushing .cursor-pill, body.brushing .grid .cursor { opacity: 0 !important; }

/* settings: bots */
.gear { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); font-size: 15px; border: 1px solid var(--line); background: var(--track); }
.gear:hover, .gear.on { color: var(--text); background: var(--hover); }
.pop {
  position: absolute; right: 18px; top: 118px; width: 340px; z-index: 30;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.08);
}
.pop[hidden] { display: none; }
.pop-h { display: flex; align-items: center; font-weight: 650; font-size: 14px; margin-bottom: 4px; }
.pop-x { margin-left: auto; width: 22px; height: 22px; border-radius: 6px; color: var(--muted); font-size: 16px; }
.pop-x:hover { background: var(--hover); color: var(--text); }
.pop-sub { color: var(--muted); font-size: 12px; margin: 6px 0; }
.pop-sub code { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--track); padding: 0 4px; border-radius: 4px; }
.bot-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.bchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border-radius: 8px; background: var(--track); border: 1px solid var(--line-strong); font: 560 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.bchip .bn { color: var(--faint); font: 500 11px -apple-system, system-ui, sans-serif; }
.bchip button { width: 18px; height: 18px; border-radius: 5px; color: var(--muted); }
.bchip button:hover { background: var(--hover); color: var(--rotting); }
.bchip.add { padding-right: 9px; color: var(--accent); border-style: dashed; cursor: pointer; }
.bchip.add:hover { background: var(--accent-soft); }
.bot-form { display: flex; gap: 6px; }

      const px = x(t);
      if (t > 0) grid.push(`<div class="gl" style="left:${px}%"></div>`);
      if (i % labelEvery === 0 && Math.abs(px - x(0)) > 13 && px > 3) ticks.push(`<div class="tick" style="left:${px}%">${fmtDate(dateOf(t))}</div>`);

function hashHue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

  const bg = p.color ?? `linear-gradient(135deg,hsl(${hashHue(n)} 70% 60%),hsl(${(hashHue(n) + 40) % 360} 70% 50%))`;

// Events on the bar: commits are thin ticks (a barcode of work); people's actions are tiny avatars with a ring

const CLUSTER = 3.2;
const MARK_TYPES = ['approved', 'changes', 'comment', 'requested', 'ci_fail'];
function miniAvatar(n) {

function eventMarks(p, r) {
  const evs = p.events.filter(e => e.t <= r && !(e.who && isBot(e.who)));

  const own = e => e.type === 'commit' || (e.type === 'comment' && e.who === p.author);
  const ticks = evs.filter(own)
    .map(e => `<i class="tick-c" style="left:${x(e.t)}%" data-tip="${esc(tip(e))}"></i>`).join('');
  const marks = evs.filter(e => !own(e) && MARK_TYPES.includes(e.type)).sort((a, b) => b.t - a.t);

    const faces = Object.values(c.items.reduce((m, e) => {

      return m;
    }, {}));
    return `<div class="mk" style="left:${c.x}%" data-tip="${esc(c.items.map(tip).join('\n'))}">` +

}

  const iStart = hasActive ? aEnd : a0;

  const segZ = p.snooze != null ? `<div class="snz-tag">💤 ${fmtDate(dateOf(p.snooze))}</div>` : '';

const ICON_BRANCH = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>';

    units: [...bots].sort((a, b) => a.repo.localeCompare(b.repo) || key(a) - key(b)).map(p => ({ kind: 'pr', id: String(p.id), pr: p, prs: [p] })) });

function repoHeadHTML(g) {

  const showOwner = new Set(PRS.map(p => p.fullRepo.split('/')[0])).size > 1;

function renderRows() {

// Quiet, Get Info-style: a title, one plain sentence about where the PR stands, a two-column list of facts, native buttons.
// Color is only used where it carries meaning: the freshness dot, failing checks, and the default button.

const first = n => n === ME ? 'you' : who(n);

  if (p.snooze != null) return `Snoozed until ${fmtDate(dateOf(p.snooze))}.`;
  if (!isMine(p)) return personalReq(p) ? `Waiting on you for ${fmtLong(s)}.` : `Opened ${fmtLong(p.created)} ago.`;
  return s < 1 ? 'Worked on today.' : `Quiet for ${fmtLong(s)}.`;

  const a = nextAction(p), last = t => [...p.events].reverse().find(e => e.type === t);

    case 'fix':

      if (p.ci === 'fail') return 'Checks are failing.';
      if (p.review === 'changes') { const e = last('changes'); return e ? `${who(e.who)} asked for changes ${fmtLong(e.t)} ago.` : 'Changes were requested.'; }
      return p.draft ? 'It is still a draft.' : '';
    case 'win': { const e = last('approved'); return `${e ? `Approved by ${who(e.who)}` : 'Approved'}, ready to merge.`; }
    case 'nudge': return `No reply from ${p.reviewers.map(who).join(' or ')} yet.`;
    case 'ok': return `In review with ${p.reviewers.map(who).join(' and ')}.`;
    case 'review': return `${who(p.author)} asked for your review.`;
    case 'team': return 'Your team was asked to review it.';
    case 'bot': return `Opened by ${who(p.author)}.`;
    case 'decide': return 'Revive it or close it.';
    default: return '';
  }
}
const info = (k, v) => `<div class="i-k">${k}</div><div class="i-v">${v}</div>`;
function snoozeMenu(p) {

}
let drag = null, suppressClick = false;
const SNAPS = [0, 1, 2, 3, 5, 7, 10, 14, 21, 30, 45, 60, 90, 120, 182];
function snapDays(pct) {
  const cands = [...SNAPS.filter(d => d < R()), R()];
  return cands.reduce((best, d) => Math.abs(x(d) - pct) < Math.abs(x(best) - pct) ? d : best, cands[0]);
}
function brushRange(a, b) {          // a < b in % → [fewer days, more days], snapped
  const lo = snapDays(b), hi = snapDays(a);
  return lo === hi ? null : [lo, hi >= R() ? Infinity : hi];
}
$('rows').addEventListener('mousedown', e => {
  const grid = document.querySelector('.grid');
  if (!grid || e.button !== 0 || e.target.closest('button')) return;
  const gr = grid.getBoundingClientRect(), pct = (e.clientX - gr.left) / gr.width * 100;
  if (pct < 0 || pct > 100) return;
  drag = { start: pct, now: pct, gr, moved: false };
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  drag.now = Math.max(0, Math.min(100, (e.clientX - drag.gr.left) / drag.gr.width * 100));
  if (Math.abs(drag.now - drag.start) < 1.2 && !drag.moved) return;
  drag.moved = true;
  const r = brushRange(Math.min(drag.start, drag.now), Math.max(drag.start, drag.now));
  if (r) paintBrush(clampX(r[1]), clampX(r[0]), r);
  document.body.classList.add('brushing');
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  const { start, now, moved } = drag; drag = null;
  document.body.classList.remove('brushing');
  if (!moved) return;                                   // a plain click: let it select the row
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  const r = brushRange(Math.min(start, now), Math.max(start, now));
  if (r) setIdleRange(r); else renderRows();
});

document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.stopPropagation(); return; }
  if (e.target.closest('[data-clearbrush]')) { setIdleRange(null); return; }
  const sz = e.target.closest('[data-snooze]');
  if (sz) { state.snoozeDays = +sz.dataset.snooze; doAction('snooze'); return; }
  const zone = e.target.closest('[data-zone]');
  if (zone) { const z = freshZones().find(z => z.k === zone.dataset.zone); setIdleRange(sameRange(idleRange(), z.range) ? null : z.range); renderSummary(); return; }
  const ui = e.target.closest('[data-ui],[data-rmbot],[data-addbot],[data-resetbots]');
  if (ui) {
    if (ui.dataset.ui === 'settings') openSettings(true);
    else if (ui.dataset.ui === 'snooze-menu') { const m = $('snoozeMenu'); if (m) m.hidden = !m.hidden; }
    else if (ui.dataset.rmbot) setBots(BOTS.filter(b => b !== ui.dataset.rmbot));
    else if (ui.dataset.addbot) setBots([...BOTS, ui.dataset.addbot]);
    else if ('resetbots' in ui.dataset) setBots(DEFAULT_BOTS);
    return;
  }
  if (e.target.closest('#settingsWin')) return;
  const v = e.target.closest('[data-view]');
  if (v) { state.detailView = v.dataset.view; try { localStorage.setItem('detailView', state.detailView); } catch {} return renderCard(); }
  const t = e.target.closest('[data-toggle],[data-tab],[data-sort],[data-range],[data-pick],[data-act],.row');
  if (!t) return;
  if (t.dataset.toggle) { e.stopPropagation(); toggle(t.dataset.toggle); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; render(); }
  else if (t.dataset.sort) { state.sort = t.dataset.sort; render(); }
  else if (t.dataset.range) { state.range = t.dataset.range === 'log' ? 'log' : +t.dataset.range; render(); }
  else if (t.dataset.pick) {
    state.sel = t.dataset.pick;
    const p = byId(state.sel);
    if (p?.stack && isCollapsed(STACK + p.stack.id)) state.toggled.delete(STACK + p.stack.id);
    render(); scrollToSel();
  }
  else if (t.dataset.act === 'ask' || t.dataset.act === 'nudge') {
    const p = byId(state.sel), n = t.dataset.who;
    if (p && t.dataset.act === 'ask') { p.allReviewers.push(n); p.reviewers.push(n); p.events.push({ t: 0, type: 'requested', who: n }); }
    toast(t.dataset.act === 'ask' ? `Asked ${who(n)} to review #${p?.num}` : `Nudged ${who(n)}`); render();
  }
  else if (t.dataset.act) doAction(t.dataset.act);
  else if (t.classList.contains('row')) { state.sel = t.dataset.id; renderRows(); renderCard(); }
});
function scrollToSel() { document.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

const q = $('q');
q.addEventListener('input', () => { state.q = q.value; renderHighlight(); renderRows(); renderCard(); });
q.addEventListener('scroll', () => { $('hl').scrollLeft = q.scrollLeft; });

document.addEventListener('keydown', e => {
  if (!$('settingsWin').hidden) { if (e.key === 'Escape') openSettings(false); return; }
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); return; }
  if (e.key === 'Escape') { q.blur(); if (state.q) { q.value = state.q = ''; renderHighlight(); render(); } return; }
  const inInput = document.activeElement === q;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || (!inInput && (e.key === 'j' || e.key === 'k'))) {
    e.preventDefault();
    const ids = [...document.querySelectorAll('#rows .row')].map(r => r.dataset.id);
    const i = ids.indexOf(state.sel), d = (e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1;
    state.sel = ids[Math.max(0, Math.min(ids.length - 1, i + d))];
    renderRows(); renderCard(); scrollToSel();
  } else if (!inInput && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const p = byId(state.sel);
    const gid = p ? (isBot(p.author) ? BOTS_GROUP : REPO + p.fullRepo) : null;
    if (gid) toggle(gid, e.key === 'ArrowRight');
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const p = byId(state.sel);
    if (p && smellOf(p).k === 'blocked') { state.sel = String(baseOf(p.stack.id).id); render(); scrollToSel(); }
    else doAction('primary');
  }
  else if (!inInput && (e.key === 's' || e.key === 'S')) doAction('snooze');
  else if (!inInput && (e.key === 'o' || e.key === 'O')) doAction('open');
});

// hover scrubber + event tooltips
const tip = $('tip');
$('rows').addEventListener('mousemove', e => {
  const ev = e.target.closest('[data-tip]');
  if (ev) { tip.textContent = ev.dataset.tip; const r = ev.getBoundingClientRect(); tip.style.left = r.left + r.width / 2 + 'px'; tip.style.top = r.top + 'px'; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
  const grid = document.querySelector('.grid'); if (!grid) return;
  const gr = grid.getBoundingClientRect(), pct = (e.clientX - gr.left) / gr.width * 100;
  const line = $('cline'), pill = $('cpill');
  if (pct < 0 || pct > 100) { line.style.opacity = pill.style.opacity = 0; return; }
  const t = tAt(pct);
  line.style.left = pill.style.left = pct + '%';
  pill.style.transform = pct > 88 ? 'translateX(-100%)' : pct < 8 ? 'translateX(0)' : '';
  pill.textContent = `${fmtDate(dateOf(t))} · ${t < 1 ? 'today' : fmtDays(t) + ' ago'}`;
  line.style.opacity = pill.style.opacity = 1;
});
$('rows').addEventListener('mouseleave', () => { tip.style.opacity = 0; const l = $('cline'), p = $('cpill'); if (l) l.style.opacity = p.style.opacity = 0; });

renderHighlight();
render();
</script>
</body>
</html>
